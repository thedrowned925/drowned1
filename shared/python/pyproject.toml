[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drowned-shared"
version = "0.1.0"
description = "Shared protocol, chunking and GitHub backend for Drowned Distribution Suite"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drowned_shared*"]
