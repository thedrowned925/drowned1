name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'shared/python/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'shared/python/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Drowned-Release-Manager
            dir: windows/release-manager
            entry: app_v18.py
          - name: Drowned-Launcher
            dir: windows/launcher
            entry: app_v18.py
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            shared/python/pyproject.toml
            windows/release-manager/requirements.txt
            windows/launcher/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install pyinstaller
          python -m pip install shared/python
          python -m pip install -r ${{ matrix.app.dir }}/requirements.txt

      - name: Compile and verify imports
        run: |
          python -c "import drowned_shared; import drowned_shared.addons; import drowned_shared.addon_publish; import drowned_shared.addon_delete; print('drowned_shared:', drowned_shared.__file__)"
          python -m py_compile shared/python/drowned_shared/addons.py
          python -m py_compile shared/python/drowned_shared/addon_publish.py
          python -m py_compile shared/python/drowned_shared/addon_delete.py
          python -m py_compile windows/release-manager/game_prepare.py
          python -m py_compile windows/release-manager/game_download_v2.py
          python -m py_compile windows/release-manager/fdm_bridge.py
          python -m py_compile windows/release-manager/fdm_ui_v2.py
          python -m py_compile windows/release-manager/fdm_ui_v3.py
          python -m py_compile windows/release-manager/fdm_submit_v4.py
          python -m py_compile "${{ matrix.app.dir }}/${{ matrix.app.entry }}"
          if ("${{ matrix.app.name }}" -eq "Drowned-Release-Manager") {
            Push-Location windows/release-manager
            python -c "import app_v18; import fdm_ui_v3; import fdm_submit_v4; import fdm_bridge; assert hasattr(fdm_bridge, '_noop'); print('Release Manager import chain OK')"
            Pop-Location
          }

      - name: Run shared protocol tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --paths "shared/python"
          --collect-all drowned_shared
          --name "${{ matrix.app.name }}"
          "${{ matrix.app.dir }}/${{ matrix.app.entry }}"

      - name: Verify packaged shared module
        shell: pwsh
        run: |
          $archive = "dist/${{ matrix.app.name }}/${{ matrix.app.name }}.exe"
          if (!(Test-Path $archive)) { throw "Built executable was not found: $archive" }
          python -m PyInstaller.utils.cliutils.archive_viewer -r $archive | Out-File -Encoding utf8 archive-contents.txt
          if (-not (Select-String -Path archive-contents.txt -Pattern "drowned_shared" -Quiet)) {
            throw "PyInstaller archive does not contain drowned_shared"
          }
          if (-not (Select-String -Path archive-contents.txt -Pattern "drowned_shared.addons" -Quiet)) {
            throw "PyInstaller archive does not contain optional-package backend"
          }
          if ("${{ matrix.app.name }}" -eq "Drowned-Release-Manager") {
            if (-not (Select-String -Path archive-contents.txt -Pattern "game_prepare" -Quiet)) {
              throw "Release Manager archive does not contain game_prepare"
            }
            if (-not (Select-String -Path archive-contents.txt -Pattern "fdm_bridge" -Quiet)) {
              throw "Release Manager archive does not contain FDM integration bridge"
            }
            if (-not (Select-String -Path archive-contents.txt -Pattern "fdm_ui_v2" -Quiet)) {
              throw "Release Manager archive does not contain FDM destination compatibility bridge"
            }
            if (-not (Select-String -Path archive-contents.txt -Pattern "fdm_submit_v4" -Quiet)) {
              throw "Release Manager archive does not contain FDM direct URL handoff"
            }
            if (-not (Select-String -Path archive-contents.txt -Pattern "pywinauto" -Quiet)) {
              throw "Release Manager archive does not contain pywinauto FDM modal automation"
            }
            if (-not (Select-String -Path archive-contents.txt -Pattern "psutil" -Quiet)) {
              throw "Release Manager archive does not contain process telemetry"
            }
          }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/${{ matrix.app.name }}/${{ matrix.app.name }}.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "${{ matrix.app.name }} exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-Windows
          path: dist/${{ matrix.app.name }}/
          compression-level: 0
