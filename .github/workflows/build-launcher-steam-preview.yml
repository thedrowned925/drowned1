name: Build Launcher Steam Preview

on:
  push:
    branches: [feat/launcher-steam-desktop]
    paths:
      - 'windows/launcher/app_steam.py'
      - 'windows/launcher/steam_desktop_widgets.py'
      - 'windows/launcher/requirements.txt'
      - 'tests/test_launcher_steam.py'
      - '.github/workflows/build-launcher-steam-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-steam-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            shared/python/pyproject.toml
            windows/launcher/requirements.txt
      - name: Install launcher dependencies
        run: |
          python -m pip install pyinstaller
          python -m pip install shared/python
          python -m pip install -r windows/launcher/requirements.txt
      - name: Run regression and native UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -v
      - name: Build isolated preview
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --paths shared/python --collect-all drowned_shared
          --name Drowned-Launcher-Steam-Preview
          windows/launcher/app_steam.py
      - name: Verify packaged modules
        shell: pwsh
        run: |
          $exe = 'dist/Drowned-Launcher-Steam-Preview/Drowned-Launcher-Steam-Preview.exe'
          python -m PyInstaller.utils.cliutils.archive_viewer -r $exe | Out-File -Encoding utf8 launcher-preview-archive.txt
          foreach ($module in @('steam_desktop_widgets', 'app_v12', 'drowned_shared.addons')) {
            if (-not (Select-String -Path launcher-preview-archive.txt -Pattern $module -Quiet)) { throw "Missing module: $module" }
          }
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/Drowned-Launcher-Steam-Preview/Drowned-Launcher-Steam-Preview.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Launcher exited with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Drowned-Launcher-Steam-Preview-Windows-x64
          path: dist/Drowned-Launcher-Steam-Preview/
          compression-level: 0
          retention-days: 14
