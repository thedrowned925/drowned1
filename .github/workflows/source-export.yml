name: Temporary Source Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create full source archive
        run: |
          zip -r Drowned-Full-Source-main.zip . \
            -x '.git/*' \
            -x 'Drowned-Full-Source-main.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Drowned-Full-Source-main
          path: Drowned-Full-Source-main.zip
          compression-level: 0
          retention-days: 1
