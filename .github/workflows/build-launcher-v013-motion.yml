name: Build Launcher v0.13 Steam Motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-launcher-v013-motion.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            shared/python/pyproject.toml
            windows/launcher/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m pip install shared/python
          python -m pip install -r windows/launcher/requirements.txt

      - name: Compile Launcher UI stack
        shell: pwsh
        run: |
          python -m py_compile windows/launcher/app_v12.py
          python -m py_compile windows/launcher/app_v13.py

      - name: Run full test suite
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build Launcher v0.13
        shell: pwsh
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --paths "shared/python"
          --collect-all drowned_shared
          --name "Drowned-Launcher"
          "windows/launcher/app_v13.py"

      - name: Verify packaged Launcher
        shell: pwsh
        run: |
          $exe = "dist/Drowned-Launcher/Drowned-Launcher.exe"
          if (!(Test-Path $exe)) { throw "Launcher executable missing" }
          python -m PyInstaller.utils.cliutils.archive_viewer -r $exe | Out-File -Encoding utf8 launcher-archive.txt
          foreach ($module in @("drowned_shared.addons", "app_v12", "app_v13")) {
            if (-not (Select-String -Path launcher-archive.txt -Pattern $module -Quiet)) {
              throw "Launcher package missing $module"
            }
          }

      - name: Smoke test Launcher
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Drowned-Launcher/Drowned-Launcher.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "Launcher exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Package Launcher
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Drowned-Launcher/*" -DestinationPath "Drowned-Launcher-v0.13.0-Steam-Motion-UI-Windows.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "drowned-launcher-steam-motion-v0.13.0" `
            --title "Drowned Launcher v0.13.0 — Steam Motion UI" `
            --notes "UI-only Launcher release. Functional layer remains app_v12 unchanged: downloads, installs, repair, optional packages, catalog, settings, controller navigation and existing credentials/settings behavior are inherited verbatim. v0.13 adds a Steam-inspired visual skin, cinematic hero lighting, ambient drifting particles, animated top accent sweep, hover/focus glows, play-button breathing glow, selection/card fades and animated startup. Release Manager is not changed." `
            "Drowned-Launcher-v0.13.0-Steam-Motion-UI-Windows.zip"

      - name: Report build status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          BODY="status=${BUILD_STATUS}\nrun=${GITHUB_RUN_ID}\nsha=${GITHUB_SHA}\ntime=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT=$(printf "%b" "$BODY" | base64 -w0)
          EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v013-motion.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v013-motion.txt" \
              -f message="Update Launcher v0.13 build status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v013-motion.txt" \
              -f message="Record Launcher v0.13 build status" \
              -f content="$CONTENT" >/dev/null
          fi
