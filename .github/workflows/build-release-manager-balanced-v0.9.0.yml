name: Build Release Manager Balanced v0.9.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release-manager-balanced-v0.9.0.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            shared/python/pyproject.toml
            windows/release-manager/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install pyinstaller
          python -m pip install shared/python
          python -m pip install -r windows/release-manager/requirements.txt

      - name: Test balanced upload planner
        run: |
          python -m py_compile shared/python/drowned_shared/turbo_upload.py
          python -m py_compile shared/python/drowned_shared/publish.py
          python -m py_compile shared/python/drowned_shared/direct_stream.py
          python -m py_compile windows/release-manager/app_v9.py
          python tests/test_turbo_upload.py

      - name: Build Windows application
        shell: pwsh
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --paths "shared/python"
          --collect-all drowned_shared
          --name "Drowned-Release-Manager"
          "windows/release-manager/app_v9.py"

      - name: Verify packaged backend
        shell: pwsh
        run: |
          $exe = "dist/Drowned-Release-Manager/Drowned-Release-Manager.exe"
          if (!(Test-Path $exe)) { throw "Built executable was not found" }
          python -m PyInstaller.utils.cliutils.archive_viewer -r $exe | Out-File -Encoding utf8 archive-contents.txt
          if (-not (Select-String -Path archive-contents.txt -Pattern "drowned_shared" -Quiet)) {
            throw "PyInstaller archive does not contain drowned_shared"
          }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Drowned-Release-Manager/Drowned-Release-Manager.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Drowned Release Manager exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Drowned-Release-Manager/*" -DestinationPath "Drowned-Release-Manager-v0.9.0-Balanced-Direct-Stream-Windows.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "release-manager-balanced-v0.9.0" `
            --title "Drowned Release Manager v0.9.0 - Balanced Direct Stream" `
            --notes "Balanced Direct Stream uploader. Adaptive 40-64 stream full-wave planning, 1900 MiB safe maximum chunk size, no game-data temp BIN staging, existing keyring/PAT identity unchanged." `
            "Drowned-Release-Manager-v0.9.0-Balanced-Direct-Stream-Windows.zip"
