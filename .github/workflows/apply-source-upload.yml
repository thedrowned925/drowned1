name: Apply Source Upload

on:
  push:
    branches: [main]
    paths:
      - '.source-upload/**'
      - '.github/workflows/apply-source-upload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply uploaded source changes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/build-windows.yml /tmp/build-windows.yml
          cp .github/workflows/ci.yml /tmp/ci.yml
          cp .github/workflows/release.yml /tmp/release.yml
          cat .source-upload/part-* > /tmp/source-update.b64
          base64 -d /tmp/source-update.b64 > /tmp/source-update.tgz
          tar -xzf /tmp/source-update.tgz -C .
          cp /tmp/build-windows.yml .github/workflows/build-windows.yml
          cp /tmp/ci.yml .github/workflows/ci.yml
          cp /tmp/release.yml .github/workflows/release.yml
          rm -rf .source-upload
          rm -f .github/workflows/apply-source-upload.yml
          git config user.name "thedrowned925"
          git config user.email "chatgpticib1@gmail.com"
          git add -A
          git commit -m "apply uploaded Claude source update"
          git push
