name: Remote Control Branch CI

on:
  push:
    branches:
      - feature/remote-control-agent
    paths:
      - 'mobile/control-app/**'
      - 'windows/control-agent/**'
      - '.github/workflows/remote-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/control-agent/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            windows/control-agent/agent.py \
            windows/control-agent/launcher.py \
            windows/control-agent/download_watcher.py

      - name: Test download watcher behavior
        working-directory: windows/control-agent
        run: python test_download_watcher.py

      - name: Smoke-test LAN Agent construction and filesystem API
        working-directory: windows/control-agent
        env:
          DROWNED_REMOTE_TOKEN: ci-test-token-ci-test-token
        run: |
          python - <<'PY'
          from agent import Agent
          agent = Agent()
          payload = agent.status_payload()
          assert payload['type'] == 'agent_status'
          assert 'remote_folder_browser' in payload['capabilities']
          assert isinstance(agent.list_drives(), list)
          print('LAN Agent smoke test OK')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle -p mobile/control-app :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -f mobile/control-app/app/build/outputs/apk/debug/app-debug.apk
