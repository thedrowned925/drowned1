name: Suite Release
on:
  push:
    tags: ['suite-v*']
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        app:
          - name: Drowned-Release-Manager
            dir: windows/release-manager
          - name: Drowned-Launcher
            dir: windows/launcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: python -m pip install pyinstaller
      - run: python -m pip install -e shared/python
      - run: python -m pip install -r ${{ matrix.app.dir }}/requirements.txt
      - shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "${{ matrix.app.name }}" "${{ matrix.app.dir }}/app.py"
          Compress-Archive -Path "dist/${{ matrix.app.name }}/*" -DestinationPath "${{ matrix.app.name }}-${{ github.ref_name }}-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}
          path: ${{ matrix.app.name }}-${{ github.ref_name }}-Windows-x64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - working-directory: android
        run: gradle :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Drowned-Mobile-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Drowned-Mobile
          path: Drowned-Mobile-${{ github.ref_name }}.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts }
      - run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" --generate-notes $(find artifacts -type f -printf '%p ') SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
