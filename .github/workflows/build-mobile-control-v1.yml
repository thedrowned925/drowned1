name: Build Drowned Control v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mobile-control-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p mobile/control-app :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f mobile/control-app/app/build/outputs/apk/debug/app-debug.apk
          cp mobile/control-app/app/build/outputs/apk/debug/app-debug.apk Drowned-Control-v1.0.0.apk
          ls -lh Drowned-Control-v1.0.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "drowned-control-v1.0.0" \
            --title "Drowned Control v1.0.0 - Android" \
            --notes "Read-only Android dashboard for Drowned releases. Shows game artwork, versions/channels, per-game size, total catalog storage, search/filter and cached offline viewing. Contains no GitHub PAT and has no write/delete/publish capability." \
            Drowned-Control-v1.0.0.apk
