name: Build Drowned Control v1.1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/control-app/**'
      - '.github/workflows/build-mobile-control-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p mobile/control-app :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f mobile/control-app/app/build/outputs/apk/debug/app-debug.apk
          cp mobile/control-app/app/build/outputs/apk/debug/app-debug.apk Drowned-Control-v1.1.0.apk
          ls -lh Drowned-Control-v1.1.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "drowned-control-v1.1.0" >/dev/null 2>&1; then
            gh release upload "drowned-control-v1.1.0" Drowned-Control-v1.1.0.apk --clobber
          else
            gh release create "drowned-control-v1.1.0" \
              --title "Drowned Control v1.1.0 - Android" \
              --notes "Read-only Android dashboard for Drowned releases. v1.1.0 adds a Release Manager tab that tracks GitHub Actions pipeline runs, published GitHub Releases, and per-component build status files. The original catalog dashboard is unchanged. Contains no GitHub PAT and has no write/delete/publish capability." \
              Drowned-Control-v1.1.0.apk
          fi

      - name: Report build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          BODY="status=${BUILD_STATUS}\nrun=${GITHUB_RUN_ID}\nsha=${GITHUB_SHA}\ntime=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT=$(printf "%b" "$BODY" | base64 -w0)
          EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.build-status/mobile-control-v1.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/mobile-control-v1.txt" \
              -f message="Update mobile control build status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/mobile-control-v1.txt" \
              -f message="Record mobile control build status" \
              -f content="$CONTENT" >/dev/null
          fi
