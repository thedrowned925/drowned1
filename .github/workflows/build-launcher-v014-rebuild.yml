# Ground-up Launcher v0.14 UI validation package.
name: Build Launcher v0.14 Rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-launcher-v014-rebuild.yml'

permissions:
  contents: write

concurrency:
  group: launcher-v014-rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            shared/python/pyproject.toml
            windows/launcher/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m pip install shared/python
          python -m pip install -r windows/launcher/requirements.txt

      - name: Compile UI stack
        shell: pwsh
        run: |
          python -m py_compile windows/launcher/app_v12.py
          python -m py_compile windows/launcher/app_v14.py

      - name: Run full test suite
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Verify visible action controls
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          @'
          import sys
          sys.path.insert(0, "windows/launcher")
          from PySide6.QtWidgets import QApplication
          import app_v14

          app = QApplication([])
          win = app_v14.Launcher()
          win.resize(1460, 900)
          win.show()
          for _ in range(8):
              app.processEvents()

          controls = {
              "install": win.install_button,
              "verify": win.verify_button,
              "uninstall": win.uninstall_button,
          }
          failures = []
          for name, widget in controls.items():
              size = widget.size()
              print(name, "visible=", widget.isVisibleTo(win), "size=", size.width(), "x", size.height(), "text=", widget.text())
              if not widget.isVisibleTo(win) or size.width() < 60 or size.height() < 24:
                  failures.append(name)
          if failures:
              raise SystemExit("Invisible/collapsed action controls: " + ", ".join(failures))

          if win.info_card.parentWidget() is None:
              raise SystemExit("Action info card lost its parent")
          if not hasattr(win, "addon_panel"):
              raise SystemExit("Optional package panel was not attached")
          win.close()
          app.processEvents()
          '@ | python -X utf8 -

      - name: Build Launcher v0.14
        shell: pwsh
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --paths "shared/python"
          --collect-all drowned_shared
          --name "Drowned-Launcher"
          "windows/launcher/app_v14.py"

      - name: Verify packaged Launcher
        shell: pwsh
        run: |
          $exe = "dist/Drowned-Launcher/Drowned-Launcher.exe"
          if (!(Test-Path $exe)) { throw "Launcher executable missing" }
          python -m PyInstaller.utils.cliutils.archive_viewer -r $exe | Out-File -Encoding utf8 launcher-archive.txt
          foreach ($module in @("app_v14", "app_v12", "drowned_shared.addons")) {
            if (-not (Select-String -Path launcher-archive.txt -Pattern $module -Quiet)) {
              throw "Launcher package missing $module"
            }
          }

      - name: Smoke test Launcher
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Drowned-Launcher/Drowned-Launcher.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { throw "Launcher exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Package Launcher
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Drowned-Launcher/*" -DestinationPath "Drowned-Launcher-v0.14.0-Rebuilt-UI-Windows.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "drowned-launcher-rebuilt-v0.14.0"
          $asset = "Drowned-Launcher-v0.14.0-Rebuilt-UI-Windows.zip"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag `
              --title "Drowned Launcher v0.14.0 — Rebuilt Library UI" `
              --notes "Ground-up Launcher UI rebuild. Functional layer remains app_v12: downloads, install/resume, verify/repair, uninstall, optional packages, catalog, settings, controller/Big Picture and existing credentials/settings behavior are inherited. v0.14 replaces the desktop visual tree with a new library rail, cinematic parallax game hero, high-contrast action deck, card-based overview, redesigned downloads workspace, page crossfades and interactive control motion. Release Manager is unchanged." `
              $asset
          }

      - name: Report build status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          BODY="status=${BUILD_STATUS}\nrun=${GITHUB_RUN_ID}\nsha=${GITHUB_SHA}\ntime=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT=$(printf "%b" "$BODY" | base64 -w0)
          EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v014-rebuild.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v014-rebuild.txt" \
              -f message="Update Launcher v0.14 rebuild status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.build-status/launcher-v014-rebuild.txt" \
              -f message="Record Launcher v0.14 rebuild status" \
              -f content="$CONTENT" >/dev/null
          fi
